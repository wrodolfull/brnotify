name: BR Notify CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: brnotify_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brnotify_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test -w @brnotify/api
      - name: Workspace session lifecycle tests
        run: npx tsx --test apps/web/auth-session.test.mjs
      - name: API documentation and code example regression test
        run: npx tsx apps/api/scripts/docs-reference-smoke.ts
      - name: Database migration smoke test
        env:
          CI_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/brnotify_ci
        run: node apps/api/scripts/db-smoke.mjs
      - name: Tenant visibility and isolation integration test
        env:
          CI_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/brnotify_ci
        run: npx tsx apps/api/scripts/tenant-visibility-smoke.ts
      - name: Dashboard daily trend SQL regression test
        env:
          CI_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/brnotify_ci
        run: npx tsx apps/api/scripts/dashboard-smoke.ts
      - name: GoTo template test delivery history smoke
        env:
          CI_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/brnotify_ci
        run: npx tsx apps/api/scripts/goto-test-history-smoke.ts
      - name: Report SQL integration test
        env:
          CI_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/brnotify_ci
        run: npx tsx apps/api/scripts/report-smoke.ts
      - name: IVR nonexpiring token PostgreSQL regression test
        env:
          CI_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/brnotify_ci
        run: npx tsx apps/api/scripts/ivr-key-lifetime-smoke.ts
      - name: IVR on-demand PostgreSQL integration test
        env:
          CI_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/brnotify_ci
        run: npx tsx apps/api/scripts/ivr-smoke.ts
      - name: Panel notifications PostgreSQL integration test
        env:
          CI_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/brnotify_ci
        run: npx tsx apps/api/scripts/panel-notifications-smoke.ts
      - name: Dispatch pacing PostgreSQL integration test
        env:
          CI_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/brnotify_ci
        run: npx tsx apps/api/scripts/dispatch-smoke.ts
      - name: Strict external appointment synchronization PostgreSQL test
        env:
          CI_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/brnotify_ci
        run: npx tsx apps/api/scripts/appointment-sync-smoke.ts
      - name: Exact-time event scheduling PostgreSQL integration test
        env:
          CI_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/brnotify_ci
        run: npx tsx apps/api/scripts/event-scheduling-smoke.ts
      - name: Build
        run: npm run build
